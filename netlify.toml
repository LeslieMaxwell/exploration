# Root Netlify configuration
#
# For monorepo deployments, each app should have its own netlify.toml
# In Netlify dashboard, set the "Base directory" to the app folder (e.g., apps/my-app)
#
# This root file provides default settings that can be overridden by app-specific configs

[build]
  # Default build command (override in app-specific netlify.toml)
  command = "npm run build"
  # Default publish directory (override in app-specific netlify.toml)
  publish = "dist"

# Ignore builds if changes are only in other apps
# Uncomment and customize for each site:
# [build.ignore]
#   command = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
